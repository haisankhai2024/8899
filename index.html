  --bien:#0B6C8F; --bien-nhat:#E3F1F6;
  --xanh:#178A57; --xanh-nen:#E4F4EC; --vang:#B7791F; --vang-nen:#FBF1DC; --cam:#D2691E; --cam-nen:#FCEBDD; --do:#C4302B; --do-nen:#FBE5E3; --tim:#6A4FB6; --tim-nen:#ECE7F8;
  --bong:0 1px 2px rgba(20,34,48,.06),0 8px 24px rgba(20,34,48,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --nen:#0E161D; --mat:#16212A; --mat2:#1E2B36; --muc:#E4ECF2; --mo:#93A3B0; --vien:#2B3A47;
  --bien:#4FB3D6; --bien-nhat:#153745;
  --xanh:#4CC48A; --xanh-nen:#173427; --vang:#E2A93B; --vang-nen:#3A2E14; --cam:#F0925A; --cam-nen:#42281A; --do:#F0665F; --do-nen:#44201E; --tim:#A08BE0; --tim-nen:#2B2345;
  --bong:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--nen);color:var(--muc);font:15px/1.45 "Be Vietnam Pro",-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;padding-inline:14px;padding-block:0 110px}
.khung{max-width:900px;margin:0 auto}
header{padding-block:12px 6px;position:sticky;top:0;background:var(--nen);z-index:5}
.dau{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
h1 small{font-weight:500;color:var(--mo);font-size:12.5px;margin-left:6px}
.dong-ho{font-size:12.5px;color:var(--mo)}
.dong-ho b{color:var(--muc);font-weight:600}
button{font:inherit;cursor:pointer}
.nut{border:1px solid var(--vien);background:var(--mat);color:var(--muc);border-radius:10px;padding:8px 12px;font-weight:500}
.nut.chinh{background:var(--bien);border-color:var(--bien);color:#fff;font-weight:600}
.nut.do{background:var(--do);border-color:var(--do);color:#fff}
.nut.xanh{background:var(--xanh);border-color:var(--xanh);color:#fff}
.nut.nho{padding:5px 10px;font-size:13px;border-radius:8px}
.nut:disabled{opacity:.5;cursor:default}
.canh-bao{margin-top:8px;border-radius:10px;padding:9px 12px;font-size:13.5px;display:none;align-items:center;gap:10px;cursor:pointer}
.canh-bao.do{display:flex;background:var(--do-nen);color:var(--do);border:1px solid var(--do)}
.canh-bao.cam{display:flex;background:var(--cam-nen);color:var(--cam);border:1px solid var(--cam)}
.canh-bao.chuong{display:flex;background:var(--bien-nhat);color:var(--bien);border:1px solid var(--bien)}
.canh-bao b{font-size:15px}
.tom{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
@media (max-width:520px){.tom{grid-template-columns:repeat(3,1fr)}}
.o{background:var(--mat);border:1px solid var(--vien);border-radius:10px;padding:8px 10px;text-align:left;color:inherit}
.o[aria-pressed="true"]{outline:2px solid var(--bien);outline-offset:-2px}
.o .nhan{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mo);display:flex;align-items:center;gap:5px}
.o .so{font-size:20px;font-weight:700;margin-top:1px;line-height:1.1}
.cham{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--mo)}
.cham.do{background:var(--do)}.cham.cam{background:var(--cam)}.cham.vang{background:var(--vang)}.cham.xanh{background:var(--xanh)}.cham.tim{background:var(--tim)}.cham.bien{background:var(--bien)}
.loc{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.hang{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hang .tt{font-size:12px;color:var(--mo);min-width:48px}
.chip{border:1px solid var(--vien);background:var(--mat);color:var(--muc);border-radius:999px;padding:5px 11px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--bien);border-color:var(--bien);color:#fff}
input,select,textarea{width:100%;border:1px solid var(--vien);background:var(--mat);color:var(--muc);border-radius:10px;padding:9px 11px;font:inherit}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--bien);outline-offset:1px}
.tieude{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 8px}
.tieude h2{font-size:14px;margin:0;font-weight:600}
.tieude span{font-size:12.5px;color:var(--mo)}
.ds{display:flex;flex-direction:column;gap:7px}
.don{display:grid;grid-template-columns:6px 1fr;background:var(--mat);border:1px solid var(--vien);border-radius:11px;overflow:hidden;cursor:pointer;text-align:left;color:inherit;padding:0}
.don:hover{border-color:var(--bien)}
.vach{background:var(--mo)}
.don.do .vach{background:var(--do)}.don.cam .vach{background:var(--cam)}.don.vang .vach{background:var(--vang)}.don.xanh .vach{background:var(--xanh)}.don.tim .vach{background:var(--tim)}.don.bien .vach{background:var(--bien)}

.than{padding:9px 12px 9px 10px;min-width:0}
.d1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ten{font-weight:600;font-size:15.5px}
.ten small{font-weight:500;color:var(--mo);font-size:11.5px;margin-left:6px}
.gio{text-align:right;white-space:nowrap}
.gio b{font-size:15px;display:block}
.gio span{font-size:11.5px;color:var(--mo)}
.don.do .gio b{color:var(--do)}.don.cam .gio b{color:var(--cam)}
.nd{font-size:13px;color:var(--mo);margin-top:4px;white-space:pre-line;max-height:3.9em;overflow:hidden}
.d3{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.the{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--mat2);color:var(--mo)}
.the.tt-Mới{background:var(--bien-nhat);color:var(--bien)}.the.tt-Đang{background:var(--vang-nen);color:var(--vang)}.the.tt-Đã-đóng{background:var(--xanh-nen);color:var(--xanh)}.the.tt-Đã-gửi{background:var(--tim-nen);color:var(--tim)}
.trong{padding:30px;text-align:center;color:var(--mo)}
/* ngăn */
.phu-nen{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:20}
.ngan{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--mat);border-radius:16px 16px 0 0;box-shadow:var(--bong);max-height:92vh;overflow:auto;padding:14px 16px 32px;max-width:900px;margin:0 auto}
.ngan h3{margin:0 0 6px;font-size:18px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ngan h3 button{border:0;background:var(--mat2);color:var(--muc);border-radius:8px;padding:4px 10px}
.truong{margin-top:10px}
.truong label{display:block;font-size:12.5px;color:var(--mo);margin-bottom:4px;font-weight:500}
.hai{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ba{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.goi-y{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.goi-y .chip{font-size:12px;padding:3px 9px;background:var(--bien-nhat);border-color:transparent;color:var(--bien)}
.hanh-dong{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hanh-dong .nut{flex:1;min-width:120px;text-align:center}
.bang{font-size:13.5px;margin-top:8px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.bang dt{color:var(--mo)}.bang dd{margin:0;white-space:pre-line}
.ls{font-size:12.5px;color:var(--mo);margin-top:10px;border-top:1px dashed var(--vien);padding-top:8px}
.ls div{margin-top:3px}
.thong-bao{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--muc);color:var(--nen);padding:9px 14px;border-radius:10px;font-size:13.5px;z-index:30;box-shadow:var(--bong);display:none}
.noi{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--mat);border-top:1px solid var(--vien);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.noi .khung{display:flex;gap:8px}
.noi .nut{flex:1;text-align:center;padding:11px}
.dang-nhap{max-width:360px;margin:60px auto;background:var(--mat);border:1px solid var(--vien);border-radius:14px;padding:20px;box-shadow:var(--bong)}
.dang-nhap h2{margin:0 0 4px}
.dang-nhap p{color:var(--mo);font-size:13.5px;margin:0 0 12px}
.loi{color:var(--do);font-size:13px;margin-top:6px;min-height:1.2em}
.mo{color:var(--mo);font-size:12.5px}
.nhay{animation:nhay 1s infinite}
@keyframes nhay{50%{opacity:.35}}
</style></head>

    doiTrangThai:function(o){ var d=tim(o.MA); if(!d) return {ok:false,loi:'không thấy'}; var cu=d.TRANG_THAI; d.TRANG_THAI=o.TRANG_THAI; if(o.NV_DONG) d.NV_DONG=o.NV_DONG; if(o.TRANG_THAI==='Đã đóng') d.DONG_XONG_LUC=l(0); if(o.TRANG_THAI==='Đã gửi') d.GUI_LUC=l(0); if(o.ghichu) d.GHI_CHU=(d.GHI_CHU?d.GHI_CHU+'\n':'')+gioISO(new Date())+' '+o.nguoi+': '+o.ghichu; d.CAP_NHAT_LUC=l(0); d.CAP_NHAT_BOI=o.nguoi; nk.push({ma:d.MA,luc:gioISO(new Date()),nguoi:o.nguoi,viec:cu+' → '+o.TRANG_THAI,chitiet:(o.NV_DONG?'đóng: '+o.NV_DONG:'')+(o.ghichu?' · '+o.ghichu:'')}); return {ok:true}; },

    ghiCauHinh:function(o){ ['PHUT_CANH_BAO','PHUT_KHAN','PHUT_RA_SAN_BAY'].forEach(function(k){ if(o[k]) ch[k]=Number(o[k]); }); return {ok:true}; }

})();

// ===================== PHÂN LOẠI ĐƠN =====================
function mocDon(d){ return parseLuc(d.XE_CHAY_LUC) || parseLuc(d.GIAO_LUC) || null; }
function mucDo(d){ // do · cam · vang · bien · xanh · tim · xam
  var tt=d.TRANG_THAI, m=mocDon(d), p = m ? (m-Date.now())/60000 : null;
  if (tt==='Đã giao'||tt==='Huỷ') return 'xam';
  if (tt==='Đã gửi') return 'tim';
  if (tt==='Đã đóng') return (p!==null && p < -30) ? 'vang' : 'xanh';
  if (p===null) return 'vang';
  if (p <= S.ch.PHUT_KHAN) return 'do';
  if (p <= S.ch.PHUT_CANH_BAO) return 'cam';
  return 'bien';
}
function chuaXong(d){ return d.TRANG_THAI!=='Đã giao' && d.TRANG_THAI!=='Huỷ'; }
function nhomTT(d){ return !chuaXong(d) ? 2 : (d.TRANG_THAI==='Đã gửi' ? 1 : 0); }
function cungNgay(a,b){ return a && b && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function locDon(){
  var hom=new Date(), mai=new Date(Date.now()+86400000), q=S.tim.trim().toLowerCase();
  return S.don.filter(function(d){
    var m=mocDon(d), ngayDat=parseLuc(d.NGAY_DAT);
    if (S.xem==='canlam' && !chuaXong(d)) return false;
    if (S.xem==='homnay' && !((m&&cungNgay(m,hom)) || (!m&&ngayDat&&cungNgay(ngayDat,hom)) || (chuaXong(d)&&m&&m<hom))) return false;
    if (S.xem==='ngaymai' && !(m&&cungNgay(m,mai))) return false;
    if (S.xem==='daxong' && chuaXong(d)) return false;
    if (S.xem==='do' && mucDo(d)!=='do') return false;
    if (S.xem==='cam' && mucDo(d)!=='cam') return false;
    if (S.xem==='dangdong' && d.TRANG_THAI!=='Đang đóng') return false;
    if (S.xem==='dadong' && d.TRANG_THAI!=='Đã đóng') return false;
    if (S.xem==='dagui' && d.TRANG_THAI!=='Đã gửi') return false;
    if (S.vc && d.VAN_CHUYEN!==S.vc) return false;
    if (S.cuaToi && S.toi && d.NV_DONG!==S.toi && d.NV_NHAN!==S.toi) return false;
    if (q && (d.KHACH+' '+d.NOI_DUNG+' '+d.NHA_XE+' '+d.NOI_NHAN+' '+d.SDT+' '+d.MA).toLowerCase().indexOf(q)<0) return false;
    return true;
  }).sort(function(a,b){
    var xa=nhomTT(a), xb=nhomTT(b); if(xa!==xb) return xa-xb;
    var ma=mocDon(a), mb=mocDon(b); if(ma&&mb) return ma-mb; if(ma) return -1; if(mb) return 1; return (b.TAO_LUC||'').localeCompare(a.TAO_LUC||'');
  });
}

function keu(){ try{ var ac=new (window.AudioContext||window.webkitAudioContext)(); for(var i=0;i<3;i++){ var o=ac.createOscillator(), g=ac.createGain(); o.connect(g); g.connect(ac.destination); o.frequency.value=880; g.gain.value=.25; o.start(ac.currentTime+i*.35); o.stop(ac.currentTime+i*.35+.2); } }catch(e){} try{ navigator.vibrate&&navigator.vibrate([250,120,250]); }catch(e){} }
function kiemCanhBao(){
  var doMoi={}; var moi=[];
  S.don.forEach(function(d){ if(mucDo(d)==='do'){ doMoi[d.MA]=1; if(S.doCu && !S.doCu[d.MA]) moi.push(d); } });
  if (S.doCu===null){ if(Object.keys(doMoi).length) keu(); }
  else if (moi.length){ keu(); if(window.Notification && Notification.permission==='granted' && !DAY.bat){ var tieuDe='Sắp tới giờ xe — '+moi.length+' đơn cần đóng gấp', than=moi.map(function(d){return d.KHACH+' · '+(mocDon(d)?conBaoLau(mocDon(d)):'');}).join('\n'); try{ if(navigator.serviceWorker && navigator.serviceWorker.ready){ navigator.serviceWorker.ready.then(function(reg){ reg.showNotification(tieuDe,{body:than, vibrate:[250,120,250], tag:'hsk-do', renotify:true, icon:'icon-192.png'}); }); } else new Notification(tieuDe,{body:than}); }catch(e){} } }
  S.doCu=doMoi;
  try{ var soDo=Object.keys(doMoi).length; if(navigator.setAppBadge){ if(soDo) navigator.setAppBadge(soDo); else navigator.clearAppBadge(); } }catch(e){}
}

function datXem(k){ S.xem = (S.xem===k && ['do','cam','dangdong','dadong','dagui'].indexOf(k)>=0) ? 'canlam' : k; ve(); }

var DAY={bat:false, dangLam:false};
function dayHoTro(){ return !!(window.API_URL && 'serviceWorker' in navigator && 'PushManager' in window && window.Notification); }
function laIOS(){ return /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1); }
function laCaiRa(){ return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone===true; }
function u8Tu64(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; var b=atob(s), o=new Uint8Array(b.length); for(var i=0;i<b.length;i++) o[i]=b.charCodeAt(i); return o; }
function cungKhoa(sub,k){ try{ var a=new Uint8Array(sub.options.applicationServerKey); if(a.length!==k.length) return false; for(var i=0;i<a.length;i++) if(a[i]!==k[i]) return false; return true; }catch(e){ return true; } }
function veLai(){ try{ if(S.pin && S.don && !S.ngan) ve(); }catch(e){} }
function nutChuong(){ if(!window.API_URL) return ''; return ' <button class="nut nho" onclick="batThongBao()" title="'+(DAY.bat?'Thông báo đang bật':'Bật thông báo')+'">'+(DAY.bat?'🔔':'🔕')+'</button>'; }
function bangChuong(){
  if(!window.API_URL || DAY.bat) return '';
  if(laIOS() && !laCaiRa()) return '<div class="canh-bao chuong">📲 <div><b>Muốn điện thoại báo đơn cả khi tắt app:</b> bấm nút Chia sẻ của Safari → <b>Thêm vào MH chính</b>, mở app từ màn hình chính rồi bấm bật thông báo.</div></div>';
  if(!dayHoTro()) return '';
  if(Notification.permission==='denied') return '<div class="canh-bao chuong">🔕 <div>Điện thoại đang <b>chặn thông báo</b> của app. Vào Cài đặt → Thông báo → Nhận đơn HSK → cho phép, rồi mở lại app.</div></div>';
  return '<div class="canh-bao chuong" onclick="batThongBao()">🔔 <div><b>Bấm vào đây để bật thông báo.</b> Điện thoại sẽ báo khi có đơn mới và khi đơn sắp tới giờ xe, kể cả lúc đang dùng Zalo hay tắt màn hình.</div></div>';
}
function kiemDay(){ // mở app: máy đã bật thì gia hạn đăng ký; đã cho phép mà chưa có đăng ký thì tự đăng ký
  if(!dayHoTro() || !S.pin) return;
  navigator.serviceWorker.ready.then(function(reg){ return reg.pushManager.getSubscription(); }).then(function(sub){
    if(sub){ DAY.bat=true; veLai(); return dangKyMay(sub,true); }
    if(Notification.permission==='granted') return dangKyDay(true);
  }).catch(function(){});
}
function batThongBao(){
  if(laIOS() && !laCaiRa()){ alert('Trên iPhone phải cài app ra màn hình chính trước: bấm nút Chia sẻ của Safari → Thêm vào MH chính. Sau đó mở app từ màn hình chính rồi bấm bật thông báo.'); return; }
  if(!dayHoTro()){ alert('Máy này chưa nhận được thông báo đẩy. Hãy dùng app cài từ haisankhai2024.github.io/8899 (Android: mở bằng Chrome; iPhone: iOS 16.4 trở lên).'); return; }
  if(DAY.bat){ if(confirm('Thông báo đang bật. Gửi một thông báo thử tới máy này?')) navigator.serviceWorker.ready.then(function(reg){ return reg.pushManager.getSubscription(); }).then(function(sub){ if(sub) api('thuThongBao',{pin:S.pin, ep:sub.endpoint}).then(function(){ baoNhanh('Đã gửi thử — chờ vài giây'); }); }); return; }
  Promise.resolve(Notification.requestPermission()).then(function(q){
    if(q!=='granted'){ alert('Chưa được phép hiện thông báo. Vào Cài đặt của điện thoại → Thông báo → cho phép app Nhận đơn HSK, rồi bấm lại.'); veLai(); return; }

  });
}
function dangKyDay(im){
  if(DAY.dangLam) return; DAY.dangLam=true;
  return api('khoaDay').then(function(pub){ var k=u8Tu64(pub);
    return navigator.serviceWorker.ready.then(function(reg){ return reg.pushManager.getSubscription().then(function(sub){

      return (sub ? sub.unsubscribe() : Promise.resolve()).then(function(){ return reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:k}); });
    }); });
  }).then(function(sub){ DAY.dangLam=false; return dangKyMay(sub,im); })
    .catch(function(e){ DAY.dangLam=false; if(!im) alert('Chưa bật được thông báo: '+e); });
}
function dangKyMay(sub,im){

    if(!im){ baoNhanh('Đã bật — đang gửi thông báo thử'); api('thuThongBao',{pin:S.pin, ep:sub.endpoint}); }
  });
}

function formDon(d){ // d = đơn đang sửa hoặc {} khi tạo mới

  h+='<div class="truong"><label>Nội dung đơn (món · size · số lượng)</label><textarea id="fNOI_DUNG" placeholder="VD: 10kg xanh 4/5, lựa chắc không trứng">'+esc(d.NOI_DUNG||'')+'</textarea></div>';
  h+='<div class="truong"><label>Gửi bằng</label><div class="hang" id="fVC">'+VAN_CHUYEN.map(function(v){return '<button type="button" class="chip" aria-pressed="'+((d.VAN_CHUYEN||'')===v)+'" onclick="chonVC(\''+v+'\')">'+esc(v)+'</button>';}).join('')+'</div></div>';
  h+='<div id="khoiXe" class="truong" style="display:'+(d.VAN_CHUYEN==='Bay'?'none':'block')+'"><label>Nhà xe / tuyến xe</label><input id="fNHA_XE" list="dsNhaXe" value="'+esc(d.VAN_CHUYEN==='Bay'?'':(d.NHA_XE||''))+'" placeholder="VD: Quý Thảo"><datalist id="dsNhaXe">'+nx.map(function(t){return '<option value="'+esc(t)+'">';}).join('')+'</datalist></div>';
  var sbChon = d.VAN_CHUYEN==='Bay' ? String(d.NHA_XE||'').split(' · ')[0] : sb[0]; var cbChon = d.VAN_CHUYEN==='Bay' ? (String(d.NHA_XE||'').match(/chuyến (\d{2}:\d{2})/)||[])[1] : '';
  h+='<div id="khoiBay" class="truong" style="display:'+(d.VAN_CHUYEN==='Bay'?'block':'none')+'"><label>Sân bay · chuyến bay</label><div class="hai"><select id="fSAN_BAY">'+opts(sb,sbChon)+'</select><input id="fCHUYEN" list="dsChuyen" value="'+esc(cbChon||'')+'" placeholder="giờ bay VD 17:20" onchange="chonChuyen(this.value)"><datalist id="dsChuyen">'+cb.map(function(t){return '<option value="'+esc(t)+'">';}).join('')+'</datalist></div><div class="goi-y">'+cb.map(function(t){return '<button type="button" class="chip" onclick="$(\'fCHUYEN\').value=\''+t+'\';chonChuyen(\''+t+'\')">'+t+'</button>';}).join('')+'</div><div class="mo" style="margin-top:4px">Chọn chuyến → app tự điền giờ giao = giờ bay, giờ xe chạy = trước '+S.ch.PHUT_RA_SAN_BAY+' phút (đường ra sân bay).</div></div>';

function moDonMoi(){ moNgan(formDon({})); setTimeout(function(){ var e=$('fDan'); if(e) e.focus(); },60); }
function chonVC(v){ var cs=$('fVC').querySelectorAll('.chip'); for(var i=0;i<cs.length;i++) cs[i].setAttribute('aria-pressed', cs[i].textContent===v); $('khoiXe').style.display = v==='Bay'?'none':'block'; $('khoiBay').style.display = v==='Bay'?'block':'none'; }
function vcDangChon(){ var c=$('fVC').querySelector('[aria-pressed="true"]'); return c?c.textContent:''; }
function chonChuyen(gio){ var m=String(gio).match(/^(\d{1,2}):(\d{2})$/); if(!m) return; var ngay=$('fGIAO_ngay').value||$('fXE_ngay').value||ngayISO(new Date()); $('fGIAO_ngay').value=ngay; $('fGIAO_gio').value=pad(+m[1])+':'+m[2]; var d=parseLuc(ngay+'T'+pad(+m[1])+':'+m[2]); if(d && d<Date.now() && !$('fXE_ngay').value){ d=new Date(d.getTime()+86400000); $('fGIAO_ngay').value=ngayISO(d); } var x=new Date(d.getTime()-S.ch.PHUT_RA_SAN_BAY*60000); $('fXE_ngay').value=ngayISO(x); $('fXE_gio').value=gioISO(x); }
function phanTich(t){ // gợi ý từ tin nhắn dán vào — chỉ điền ô đang trống
  var goi=[]; var s=t.toLowerCase();
  var cacDong=t.split('\n'), noiDung=t.trim();
  var sdt=t.replace(/[\s.\-]/g,'').match(/(?:\+?84|0)(\d{9})/); if(sdt){ var so=(sdt[0].indexOf('84')===0||sdt[0].indexOf('+84')===0)?'0'+sdt[1]:sdt[0]; if(!$('fSDT').value) $('fSDT').value=so; goi.push('SĐT '+so); }
  if(!$('fKHACH').value || $('fKHACH').dataset.tuDong){ var dong=cacDong[0].trim(); if(dong && dong.length<=30 && !/\d{4}/.test(dong) && cacDong.length>1) { $('fKHACH').value=dong.replace(/[:\-–].*$/,'').trim(); $('fKHACH').dataset.tuDong='1'; goi.push('Khách: '+$('fKHACH').value); noiDung=cacDong.slice(1).join('\n').trim(); } }
  if(!$('fNOI_DUNG').value || $('fNOI_DUNG').dataset.tuDong){ $('fNOI_DUNG').value=noiDung; $('fNOI_DUNG').dataset.tuDong='1'; }
  var vc=''; if(/tư sang|tu sang/.test(s)) vc='Chành xe Tư Sang'; else if(/bà 7|bà bảy|ba 7|ba bay/.test(s)) vc='Chành xe Bà 7'; else if(/taxi/.test(s)) vc='Taxi'; else if(/\bbay\b|máy bay|sân bay|san bay/.test(s)) vc='Bay';
  if(vc){ if(!vcDangChon()) chonVC(vc); goi.push('Gửi: '+vc); }
  (S.dm.NHA_XE||[]).forEach(function(x){ if(s.indexOf(x.ten.toLowerCase())>=0){ if(!$('fNHA_XE').value){ $('fNHA_XE').value=x.ten; if(!vcDangChon()) chonVC('Tự gửi'); } goi.push('Nhà xe: '+x.ten); } });
  var mai=/\bmai\b|ngày mai|sáng mai|tối mai/.test(s); var ngay = mai ? ngayISO(new Date(Date.now()+86400000)) : ngayISO(new Date());
  var gio=t.match(/(\d{1,2})\s*[hg:]\s*(\d{2})?/); if(gio && +gio[1]<24){ var g=pad(+gio[1])+':'+(gio[2]||'00'); var laXe=/xe|chuyến|chành/.test(s); goi.push((laXe?'Xe chạy ':'Giao ')+g+(mai?' ngày mai':'')); if(vcDangChon()==='Bay'){ if(!$('fCHUYEN').value){ $('fCHUYEN').value=g; if(!$('fGIAO_ngay').value) $('fGIAO_ngay').value=ngay; chonChuyen(g); } } else if(laXe){ if(!$('fXE_gio').value){ $('fXE_gio').value=g; $('fXE_ngay').value=ngay; } } else if(!$('fGIAO_gio').value){ $('fGIAO_gio').value=g; $('fGIAO_ngay').value=ngay; } }
  else if(mai && !$('fGIAO_ngay').value){ $('fGIAO_ngay').value=ngay; goi.push('Giao ngày mai'); }
  var kien=t.match(/(\d+)\s*(thùng|kiện|xốp)/i); if(kien){ if(!$('fSO_KIEN').value) $('fSO_KIEN').value=kien[1]; goi.push(kien[1]+' kiện'); }
  $('goiY').innerHTML = goi.length ? goi.map(function(g){return '<span class="chip">✓ '+esc(g)+'</span>';}).join('') + '<span class="mo" style="align-self:center">— kiểm lại rồi sửa nếu sai</span>' : '';
}
function ghepLuc(ngay,gio){ ngay=$(ngay).value; gio=$(gio).value; if(!ngay) return ''; return ngay+'T'+(gio||'00:00'); }
function luuDon(ma){
  var o={pin:S.pin, nguoi:S.toi, MA:ma, KHACH:$('fKHACH').value.trim(), SDT:$('fSDT').value.trim(), NOI_NHAN:$('fNOI_NHAN').value.trim(), NOI_DUNG:$('fNOI_DUNG').value.trim(), VAN_CHUYEN:vcDangChon(), SO_KIEN:$('fSO_KIEN').value.trim(), NV_NHAN:$('fNV_NHAN').value, NV_DONG:$('fNV_DONG').value, GHI_CHU:$('fGHI_CHU').value.trim(), NGAY_DAT:$('fNGAY_DAT').value, GIAO_LUC:ghepLuc('fGIAO_ngay','fGIAO_gio'), XE_CHAY_LUC:ghepLuc('fXE_ngay','fXE_gio') };
  o.NHA_XE = o.VAN_CHUYEN==='Bay' ? ($('fSAN_BAY').value + ($('fCHUYEN').value?' · chuyến '+$('fCHUYEN').value:'')) : $('fNHA_XE').value.trim();

  if(!o.XE_CHAY_LUC && !o.GIAO_LUC){ $('loiForm').textContent='Cần ít nhất giờ xe chạy hoặc giờ giao để app cảnh báo'; return; }

  if(ma && !o.GHI_CHU) delete o.GHI_CHU;
  $('nutLuu').disabled=true; $('loiForm').textContent='Đang lưu…';
  api(ma?'suaDon':'taoDon', o).then(function(r){ if(!r.ok){ $('loiForm').textContent=r.loi||'Lỗi'; $('nutLuu').disabled=false; return; } dongNgan(); baoNhanh(ma?'Đã lưu thay đổi':'Đã tạo đơn '+r.ma); taiDuLieu(); }).catch(function(e){ $('loiForm').textContent='Lỗi: '+e; $('nutLuu').disabled=false; });
}

  var xong = !chuaXong(d);
  h+='<div class="truong"><label>Người đóng hàng</label><select id="ctNV_DONG">'+opts(nv, d.NV_DONG||S.toi, 'chưa phân')+'</select></div>';
  h+='<div class="truong"><label>Ghi chú thêm (tuỳ)</label><input id="ctGhiChu" placeholder="VD: thiếu 1kg, khách đổi giờ…"></div>';
  h+='<div class="hanh-dong">';
  if(d.TRANG_THAI==='Mới') h+='<button class="nut chinh" onclick="doiTT(\''+ma+'\',\'Đang đóng\')">▶ Nhận đóng</button>';
  if(d.TRANG_THAI==='Mới'||d.TRANG_THAI==='Đang đóng') h+='<button class="nut xanh" onclick="doiTT(\''+ma+'\',\'Đã đóng\')">✔ Đã đóng xong</button>';
  if(d.TRANG_THAI==='Đã đóng'||d.TRANG_THAI==='Đang đóng') h+='<button class="nut chinh" onclick="doiTT(\''+ma+'\',\'Đã gửi\')">🚚 Đã giao cho xe / bay</button>';
  if(d.TRANG_THAI==='Đã gửi') h+='<button class="nut xanh" onclick="doiTT(\''+ma+'\',\'Đã giao\')">🏁 Khách đã nhận</button>';
  if(xong) h+='<button class="nut" onclick="doiTT(\''+ma+'\',\'Mới\')">↩ Mở lại đơn</button>';
  h+='</div><div class="hanh-dong"><button class="nut" onclick="chep(tinDieuXe(\''+ma+'\'))">📋 Chép tin điều xe</button><button class="nut" onclick="moNgan(formDon(timDon(\''+ma+'\')))">✎ Sửa đơn</button>'+(!xong?'<button class="nut do" onclick="if(confirm(\'Huỷ đơn này?\'))doiTT(\''+ma+'\',\'Huỷ\')">Huỷ đơn</button>':'')+'</div>';
  h+='<div class="ls" id="ctLs">Đang tải lịch sử…</div>';
  moNgan(h);
  api('getNhatKy',ma).then(function(l){ var e=$('ctLs'); if(!e) return; e.innerHTML = l.length ? '<b>Lịch sử</b>'+l.map(function(x){return '<div>'+esc(x.luc)+' · '+esc(x.nguoi)+' · '+esc(x.viec)+(x.chitiet?' — '+esc(x.chitiet):'')+'</div>';}).join('') : '<i>Chưa có lịch sử</i>'; }).catch(function(){ var e=$('ctLs'); if(e) e.textContent=''; });
}
function doiTT(ma,tt){
  if(!S.toi){ baoNhanh('Chọn "Tôi là" ở đầu trang trước'); return; }
  var o={pin:S.pin, nguoi:S.toi, MA:ma, TRANG_THAI:tt, NV_DONG:$('ctNV_DONG')?$('ctNV_DONG').value:'', ghichu:$('ctGhiChu')?$('ctGhiChu').value.trim():''};
  if((tt==='Đang đóng'||tt==='Đã đóng') && !o.NV_DONG) o.NV_DONG=S.toi;
  var bs=S.ngan.querySelectorAll('button'); for(var i=0;i<bs.length;i++) bs[i].disabled=true;
  api('doiTrangThai',o).then(function(r){ if(!r.ok){ baoNhanh(r.loi||'Lỗi'); for(var i=0;i<bs.length;i++) bs[i].disabled=false; return; } dongNgan(); baoNhanh(esc(tt)); taiDuLieu(); }).catch(function(e){ baoNhanh('Lỗi: '+e); for(var i=0;i<bs.length;i++) bs[i].disabled=false; });
}
function tinDieuXe(ma){ var d=timDon(ma); if(!d) return ''; var x=d.VAN_CHUYEN==='Bay' ? (d.NHA_XE||'bay') : (d.NHA_XE ? 'xe '+d.NHA_XE : (d.VAN_CHUYEN||'')); return [d.SDT, d.KHACH, x, d.NOI_NHAN, d.SO_KIEN?d.SO_KIEN+' kiện':'', d.XE_CHAY_LUC?'xe chạy '+fmtLuc(d.XE_CHAY_LUC):''].filter(Boolean).join(' – '); }

}
